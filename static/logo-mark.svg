<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="動画分析">

  <defs>
    <linearGradient id="vaGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.55" stop-color="#1fa2ef"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- 虫めがねが重なるところは下の絵を抜いて、線が混ざらないようにする -->
    <mask id="vaCut">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="42" cy="42" r="18.5" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#vaCut)">
    <rect x="3" y="6" width="40" height="30" rx="7"
          stroke="url(#vaGrad)" stroke-width="4"/>

    <rect x="8" y="11" width="3.6" height="3.6" rx="1.1" fill="url(#vaGrad)"/>
    <rect x="8" y="19.2" width="3.6" height="3.6" rx="1.1" fill="url(#vaGrad)"/>
    <rect x="8" y="27.4" width="3.6" height="3.6" rx="1.1" fill="url(#vaGrad)"/>

    <path d="M17.5 14 L29.5 21 L17.5 28 Z" fill="url(#vaGrad)"/>
  </g>

  <circle cx="42" cy="42" r="14" stroke="url(#vaGrad)" stroke-width="4"/>

  <path d="M52 52 L59 59" stroke="url(#vaGrad)" stroke-width="5" stroke-linecap="round"/>

  <rect x="35.5" y="43" width="4" height="7" rx="1.4" fill="url(#vaGrad)"/>
  <rect x="41" y="39" width="4" height="11" rx="1.4" fill="url(#vaGrad)"/>
  <rect x="46.5" y="35" width="4" height="15" rx="1.4" fill="url(#vaGrad)"/>

</svg>
