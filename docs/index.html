<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>案件一覧 — 動画分析</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main><div class="page" id="page"><p class="muted">読み込んでいます…</p></div></main>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script>
    (async function () {
      const me = await Shell.mountShell('index.html');
      if (!me) { return; }

      const page = document.getElementById('page');

      try {
        const projects = await API.Projects.list();
        page.innerHTML = '<section class="card"><h2>案件データベース</h2>'
          + '<div class="database-count">' + projects.length + '件</div>'
          + '<ul>' + projects.map(function (p) {
              return '<li>' + Shell.escapeHtml(p.name) + ' / '
                + Shell.escapeHtml(p.genre) + ' / ' + p.video_count + '本</li>';
            }).join('') + '</ul></section>';
      } catch (err) {
        page.innerHTML = '<section class="card"><p>' + Shell.escapeHtml(err.message) + '</p></section>';
      }
    }());
  </script>
</body>
</html>
