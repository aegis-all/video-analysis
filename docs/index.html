<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>案件一覧 — 動画分析</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Cpath d='M8.5 8v11l9-5.5z' fill='%2322d3ee'/%3E%3Ccircle cx='20' cy='20' r='6' fill='none' stroke='%233b82f6' stroke-width='2.6'/%3E%3Cpath d='M24.4 24.4l3.1 3.1' stroke='%233b82f6' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main>
<div class="page">


  <!-- ========================================================
       案件を追加
       ======================================================== -->

  <section class="card new-project-card">

    <div class="new-project-header">
      <div>
        <h2>案件を追加</h2>
        <p class="new-project-lead">
          動画を登録すると、場面ごとのスクリーンショットが自動で並びます。
          動画は後から追加してもかまいません。
        </p>
      </div>
    </div>

    <form id="create-form">

      <div class="field-grid">

        <div class="field">
          <label for="genre">ジャンル<em class="field-opt">任意</em></label>
          <input type="text" id="genre" placeholder="美容 / 健康食品 / 投資"
                 list="genre-list" autocomplete="off">
          <datalist id="genre-list"></datalist>
        </div>

        <div class="field">
          <label for="name">案件名<em class="field-req">必須</em></label>
          <input type="text" id="name" required placeholder="A社 YouTube動画"
                 autocomplete="off">
        </div>

        <div class="field">
          <label for="project_no">案件番号<em class="field-opt">任意</em></label>
          <input type="text" id="project_no" placeholder="2026-001" autocomplete="off">
        </div>

        <div class="field">
          <label for="assignee">担当者<em class="field-opt">任意</em></label>
          <input type="text" id="assignee" placeholder="山田" autocomplete="off">
        </div>

      </div>

      <div class="field-section">
        <span class="field-section-label">動画</span>
        <em class="field-opt">任意</em>
        <span class="field-section-note">入れずに作ると、空の行が30行できます。</span>
      </div>

      <div class="source-picker" id="source-picker">

        <div class="source-tabs">
          <button type="button" class="source-tab is-active" data-source="file">
            📁 ファイルアップロード
          </button>
          <button type="button" class="source-tab" data-source="url">
            🔗 動画リンクから追加
          </button>
        </div>

        <div class="source-panel" data-panel="file">
          <label for="video">動画ファイルを選択</label>
          <input type="file" id="video" accept="video/*">
        </div>

        <div class="source-panel is-hidden" data-panel="url">
          <label for="video_url">動画のリンク</label>
          <input type="url" id="video_url" autocomplete="off"
                 placeholder="https://assets.douga-pro.com/youtube/xxxxx/video.mp4">
          <p class="hint muted">
            動画ファイルへの直接リンク（.mp4 など）を貼り付けてください。
          </p>
        </div>

      </div>

      <div class="form-actions">
        <button type="submit" class="primary submit-project" id="submit">案件を作成</button>
        <p class="form-actions-note" id="create-note">
          動画を入れた場合は、作成後すぐにスクリーンショットの生成が始まります
          （60秒の動画で30〜60秒ほど）。
        </p>
      </div>

    </form>

  </section>


  <!-- ========================================================
       案件データベース
       ======================================================== -->

  <section class="card projects-card">

    <div class="database-header">
      <div>
        <h2>案件データベース</h2>
        <div id="projects-count" class="database-count">—</div>
      </div>
      <button type="button" id="project-filter-clear" class="database-clear">
        条件をクリア
      </button>
    </div>

    <div class="database-toolbar">

      <div class="database-search">
        <span class="database-search-icon" aria-hidden="true">⌕</span>
        <input type="search" id="project-search"
               placeholder="ジャンル、案件名、担当者を検索" autocomplete="off">
      </div>

      <div class="database-toolbar-actions">
        <button type="button" class="database-add-filter" id="database-add-filter">
          ＋ フィルター
        </button>
        <button type="button" class="database-sort-button" id="database-sort-button">
          ↕ 並べ替え
        </button>
      </div>

    </div>

    <div id="database-filters" class="database-filters" hidden>

      <div class="filter-chip" data-filter="genre" data-key="genre">
        <button type="button" class="filter-chip-button">
          <span>ジャンル</span>
          <span class="filter-chip-count"></span>
          <span class="filter-chip-caret">▾</span>
        </button>
        <div class="filter-panel" hidden data-options="genre"></div>
      </div>

      <div class="filter-chip" data-filter="assignee" data-key="assignee">
        <button type="button" class="filter-chip-button">
          <span>担当者</span>
          <span class="filter-chip-count"></span>
          <span class="filter-chip-caret">▾</span>
        </button>
        <div class="filter-panel" hidden data-options="assignee"></div>
      </div>

    </div>

    <div id="database-sort-panel" class="database-sort-panel" hidden>

      <label>
        <span>並べ替え項目</span>
        <select id="database-sort-field">
          <option value="">なし</option>
          <option value="genre">ジャンル</option>
          <option value="name">案件名</option>
          <option value="project_no">案件番号</option>
          <option value="assignee">担当者</option>
          <option value="created">初回登録日</option>
        </select>
      </label>

      <label>
        <span>順序</span>
        <select id="database-sort-direction">
          <option value="asc">昇順</option>
          <option value="desc">降順</option>
        </select>
      </label>

    </div>

    <div class="projects-table-wrap">
      <table class="projects-table">
        <thead>
          <tr>
            <th>ジャンル</th>
            <th>案件名</th>
            <th>担当者</th>
            <th>バージョン</th>
            <th>初回登録</th>
          </tr>
        </thead>
        <tbody id="projects-body"></tbody>
      </table>
    </div>

    <div id="projects-empty" class="projects-empty" hidden>
      条件に一致する案件がありません。
    </div>

    <div class="database-no-projects" id="no-projects" hidden>
      <div class="database-no-projects-title">まだ案件がありません</div>
      <div class="muted">上のフォームから最初の案件を作成してください。</div>
    </div>

  </section>


</div>
</main>

<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script src="js/detect-run.js"></script>
<script src="js/index.js"></script>

</body>
</html>
